<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d17">
<title>VITRAL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800;6..12,900&display=swap">
<style>
:root{
  --bg:#0f0d17; --bg2:#15121f; --surface:#1c1829; --surface2:#241f35; --fg:#efeaf8; --muted:#a8a1bf; --line:#30294a;
  --gold:#e9c46a; --good:#5fd39a; --warn:#f0a066; --bad:#ef6b7b;
  --display:"Marcellus","Trajan Pro",Georgia,serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
#app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.screen{flex:1;padding:12px max(14px,env(safe-area-inset-left)) 96px max(14px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:14px}

/* barra superior */
.top{position:sticky;top:0;z-index:5;background:rgba(15,13,23,.92);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:8px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#140f1f;flex:none}
.who b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:.75rem}
.res{display:flex;gap:10px;font-weight:800;font-size:.92rem;font-variant-numeric:tabular-nums}
.res span{display:flex;align-items:center;gap:3px}
.ic-chama{color:#ff9a4d}.ic-lum{color:#b9a2ff}.ic-tal{color:var(--gold)}

/* navegação */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(21,18,31,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);padding:4px 0}
.nav button .i{font-size:1.3rem;line-height:1}
.nav button.on{color:var(--gold)}
.nav .badge{position:absolute;margin-left:22px;margin-top:-4px;background:var(--bad);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px}
.nav button{position:relative}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:var(--surface2);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(180deg,#f3d27e,#d9a93f);color:#1b1408;border:0}
.btn.good{background:#1f5a3e;border-color:#2e7a56}
.btn.bad{background:#5a1f2a;border-color:#7a2e3c}
.btn.sm{padding:8px 10px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid currentColor}
.bar{height:10px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:999px;background:var(--gold)}
.sec{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.85rem;white-space:nowrap;color:var(--muted)}
.tabs button.on{background:var(--gold);color:#1b1408;border-color:var(--gold)}

/* anjo */
.anjo{display:flex;gap:12px;align-items:flex-end}
.anjo img{width:92px;height:92px;border-radius:16px;object-fit:cover;border:2px solid var(--gold);flex:none;background:#ddd}
.anjo .bubble{flex:1;min-width:0}
.over .box{max-width:min(420px,100%)}
.bubble{background:#fff;color:#1a1626;border-radius:16px 16px 16px 4px;padding:10px 12px;font-weight:700;font-size:.95rem;position:relative}

/* missões */
.mis{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.mis .dot{width:10px;height:10px;border-radius:50%;flex:none}
.mis .t{flex:1;min-width:0}
.mis .t b{display:block;font-size:.95rem}
.mis .t small{color:var(--muted);font-size:.78rem}
.st{font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 8px;white-space:nowrap}
.st.aberta{background:#2b2540;color:var(--muted)}.st.enviada{background:#3a3214;color:var(--gold)}.st.aprovada{background:#163d2b;color:var(--good)}.st.refazer{background:#47202a;color:var(--bad)}
.foto{width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:#000}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}

/* mapa */
.vitral-head{height:150px;border-radius:14px;background-size:cover;background-position:center 30%;position:relative;overflow:hidden;border:1px solid var(--line)}
.vitral-head::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(15,13,23,.95))}
.vitral-head div{position:absolute;left:14px;bottom:10px;z-index:1}
.trilha{position:relative;padding:8px 0 20px}
.no{display:flex;align-items:center;gap:12px;margin:0 0 12px;position:relative}
.no:nth-child(even){flex-direction:row-reverse;text-align:right}
.no .bola{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;border:3px solid var(--line);background:var(--surface);flex:none;position:relative}
.no.feito .bola{border-color:var(--good);background:#163d2b}
.no.atual .bola{border-color:var(--gold);box-shadow:0 0 0 6px rgba(233,196,106,.18);animation:pulso 1.6s infinite}
.no.trav .bola{filter:grayscale(1);opacity:.55}
.no .info{flex:1}
.no .info b{display:block}
.no .info small{color:var(--muted)}
@keyframes pulso{50%{box-shadow:0 0 0 12px rgba(233,196,106,.05)}}

/* devotos */
.devs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dev{background:var(--bg2);border:2px solid var(--line);border-radius:12px;overflow:hidden;padding:0;text-align:left;position:relative}
.dev img{width:100%;aspect-ratio:3/5;object-fit:cover;object-position:top;display:block;background:#d9d9dc}
.dev .n{padding:6px 8px;font-size:.8rem;font-weight:800;display:flex;justify-content:space-between}
.dev .eq{position:absolute;top:6px;left:6px;background:var(--gold);color:#1b1408;font-size:.65rem;font-weight:900;border-radius:999px;padding:1px 6px}
.est{color:var(--gold);font-size:.75rem;letter-spacing:.05em}

/* batalha */
.batalha{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at top,#2a2140,#0f0d17 70%);display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.foes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:190px;align-items:flex-end}
.foe{width:31%;max-width:150px;text-align:center;position:relative;background:none;border:2px solid transparent;border-radius:12px;padding:4px}
.foe.alvo{border-color:var(--bad)}
.foe .arte{width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.foe .arte img{width:100%;height:100%;object-fit:cover}
.foe.morto{opacity:.15}
.foe .nm{font-size:.72rem;font-weight:800;margin-top:2px}
.hp{height:7px;background:#2a2238;border-radius:99px;overflow:hidden;margin-top:3px}
.hp i{display:block;height:100%;background:var(--bad)}
.hp.al i{background:var(--good)}
.carga i{background:var(--gold)}
.allies{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}
.ally{background:var(--surface);border:2px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.ally img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block;background:#d9d9dc}
.ally.vez{border-color:var(--gold);transform:translateY(-6px)}
.ally.morto{filter:grayscale(1);opacity:.4}
.ally .esc{position:absolute;top:4px;right:4px;font-size:.7rem;background:#2a6bd1;border-radius:99px;padding:0 5px;font-weight:900}
.ally .bx{padding:4px 5px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.log{min-height:44px;text-align:center;font-weight:800;margin:8px 0;font-size:.95rem}
.dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;font-size:1.4rem;color:#fff;text-shadow:0 2px 6px #000;animation:sobe .9s forwards;pointer-events:none}
.dmg.cura{color:var(--good)}
@keyframes sobe{to{transform:translate(-50%,-40px);opacity:0}}
.treme{animation:treme .3s}
@keyframes treme{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.combo{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;font-family:var(--display);font-size:clamp(1.3rem,7vw,2rem);color:var(--gold);text-shadow:0 0 18px rgba(233,196,106,.7);animation:combo 1.1s forwards;pointer-events:none;width:90%;text-align:center}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

/* sobreposições */
.over{position:fixed;inset:0;z-index:40;background:rgba(8,6,14,.88);display:grid;place-items:center;padding:20px}
.over .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.revela{text-align:center}
.revela img{width:62%;max-width:220px;border-radius:14px;border:4px solid var(--gold);box-shadow:0 0 40px rgba(233,196,106,.45);animation:aparece .8s}
.revela .anjo img{width:72px;height:72px;max-width:72px;border-width:2px;box-shadow:none;animation:none}
@keyframes aparece{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:50;background:#fff;color:#1a1626;font-weight:800;padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90%;text-align:center}

/* entrada */
.entrada{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:24px 20px calc(env(safe-area-inset-bottom) + 28px);background:linear-gradient(180deg,rgba(15,13,23,.1),rgba(15,13,23,.95) 62%),url(assets/reinos/centro.jpg) center top/cover}
.entrada h1{font-size:3rem;letter-spacing:.08em;text-shadow:0 2px 20px #000}
.entrada .sub{color:var(--muted);margin-bottom:8px}
.perfil{display:flex;align-items:center;gap:12px;background:rgba(28,24,41,.9);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;font-weight:800}
.tabela{width:100%;border-collapse:collapse;font-size:.85rem}
.tabela td,.tabela th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.tabela th{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.7rem}
.dias div{background:var(--bg2);border-radius:8px;padding:6px 0;border:1px solid var(--line)}
.dias div.ok{background:#163d2b;border-color:#2e7a56}
.dias b{display:block;font-size:.95rem}
/* jogo (Phaser) e vídeos */
#jogo{position:fixed;inset:0;z-index:30;background:#0f0d17;display:flex;flex-direction:column}
#jogo[hidden]{display:none}
#jogo-hud{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;font-weight:800;font-size:.9rem;background:rgba(15,13,23,.9);border-bottom:1px solid var(--line);z-index:2}
#jogo-canvas{flex:1;min-height:0;touch-action:none}
#jogo-canvas canvas{display:block}
.video{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center}
.video video{width:100%;height:100%;object-fit:contain}
.video button{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px)}
.over{z-index:70}
/* Diário do Anjo */
.pags{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pag{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 4px;color:inherit;font:inherit;min-width:0}
.pag img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:7px;background:#0b0912}
.pag b{font-size:.7rem;line-height:1.15}.pag small{font-size:.62rem;color:var(--muted)}
.pag.fechada img{filter:blur(5px) brightness(.22) grayscale(1)}
.pag.fechada b{color:var(--muted)}
/* cartas de poder */
.cartas{display:flex;flex-direction:column;gap:8px}
.carta{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:inherit;font:inherit;opacity:.55}
.carta.on{opacity:1;border-color:#7a5bd1;background:linear-gradient(135deg,#2a1f48,#1c1729)}
.carta .ic{font-size:1.6rem;text-align:center}
.carta .cn{display:flex;flex-direction:column;min-width:0}.carta .cn small{color:var(--muted);font-size:.78rem}
.carta .cv{font-size:.7rem;font-weight:900;color:var(--gold)}
.carta .cd{grid-column:2/4;font-size:.65rem;font-weight:900;letter-spacing:.08em;color:var(--muted)}
.carta.on .cd{color:#b9a2ff}
/* arrastar para confirmar e escolha de barra */
.desliza{position:relative;height:56px;border-radius:999px;background:#2a1820;border:1px solid var(--bad);display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none}
.desliza::before{content:"";position:absolute;inset:0;background:var(--bad);opacity:calc(var(--p,0)*.55)}
.desliza span{position:relative;font-weight:800;font-size:.9rem;color:#ffc9cf;padding-left:40px}
.puxa{position:absolute;left:4px;top:4px;width:48px;height:46px;border-radius:999px;border:0;background:var(--bad);color:#fff;font-size:1.4rem;font-weight:900;cursor:grab;touch-action:none}
.barra-esc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:inherit;font:inherit}
.barra-esc:active{border-color:var(--gold)}
/* Despertar: quiz e roleta do herói */
.desp{background:radial-gradient(circle at 50% 30%,#3c286e,#08060e 70%)}
.desp .box{max-width:460px;background:rgba(22,18,34,.96)}
.desp-q{margin:0;font-family:var(--display);text-wrap:balance}
.desp-ops{display:flex;flex-direction:column;gap:10px}
.desp-ops .btn{text-align:left;padding:14px 16px;font-size:1rem}
.roleta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rcarta{position:relative;border-radius:14px;overflow:hidden;border:3px solid var(--cor);aspect-ratio:3/5;background:#000;transition:transform .2s,box-shadow .2s,opacity .6s}
.rcarta img{width:100%;height:100%;object-fit:cover;object-position:top;filter:blur(9px) brightness(.45) saturate(.2);transform:scale(1.15);transition:filter 1.4s,transform 1.4s}
.rcarta span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:.62rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--cor);text-shadow:0 1px 6px #000}
.rcarta.vez{transform:translateY(-8px) scale(1.04);box-shadow:0 0 26px var(--cor)}
.rcarta.some{opacity:.15;transform:scale(.92)}
.rcarta.ganhou{transform:scale(1.08);box-shadow:0 0 44px var(--cor),0 0 90px rgba(233,196,106,.5)}
.rcarta.ganhou img{filter:none;transform:scale(1)}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;vertical-align:middle}
.sdot.ok{background:var(--good)}.sdot.indo{background:var(--gold)}.sdot.erro{background:var(--bad)}.sdot.off{background:#555}

/* abertura animada */
.abertura{position:fixed;inset:0;overflow:hidden;background:#07060b;cursor:pointer;z-index:5;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.abertura>*{pointer-events:none}
.ab-fundo{position:absolute;inset:-6%;background:url(assets/reinos/centro.jpg) center top/cover;animation:abFundo 9s ease-out forwards;filter:brightness(.15) saturate(.6)}
@keyframes abFundo{to{transform:scale(.94);filter:brightness(1) saturate(1.1)}}
.ab-raios{position:absolute;left:50%;top:13%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(rgba(255,236,170,.16) 0 4deg,transparent 4deg 13deg);mix-blend-mode:screen;opacity:0;-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:abRaios 40s linear infinite,abAparece 2.5s 1s ease forwards}
@keyframes abRaios{to{transform:rotate(360deg)}}
@keyframes abAparece{to{opacity:1}}
.ab-luz{position:absolute;left:50%;top:13%;width:60vmin;height:60vmin;margin:-30vmin 0 0 -30vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,244,200,.95),rgba(233,196,106,.35) 35%,transparent 70%);mix-blend-mode:screen;opacity:0;animation:abLuz 2.2s .6s ease-out forwards,abRespira 4s 2.8s ease-in-out infinite}
@keyframes abLuz{0%{opacity:0;transform:scale(.2)}55%{opacity:1;transform:scale(1.5)}100%{opacity:.75;transform:scale(1)}}
@keyframes abRespira{0%{opacity:.75;transform:scale(1)}50%{opacity:.45;transform:scale(1.12)}100%{opacity:.75;transform:scale(1)}}
.ab-brilhos i{position:absolute;bottom:-10px;width:var(--t);height:var(--t);border-radius:50%;background:#ffe7a3;box-shadow:0 0 8px 2px rgba(255,214,120,.8);animation:abSobe linear infinite}
@keyframes abSobe{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(30px,-105vh);opacity:0}}
.ab-texto{position:absolute;z-index:1;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 9vh);text-align:center;padding:0 20px}
.ab-texto::before{content:"";position:absolute;inset:-34vh 0 -14vh;background:linear-gradient(180deg,transparent,rgba(7,6,11,.7) 35%,rgba(7,6,11,.92) 70%);z-index:-1}
.ab-titulo{font-size:clamp(3.4rem,19vw,6rem);letter-spacing:.14em;margin-right:-.14em;color:#fff6dc;text-shadow:0 0 24px rgba(233,196,106,.85),0 0 60px rgba(233,196,106,.45)}
.ab-titulo span{display:inline-block;opacity:0;animation:abLetra .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes abLetra{from{opacity:0;transform:translateY(24px) scale(1.4);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.ab-sub{margin:6px 0 0;color:#e8dcff;font-size:1.1rem;letter-spacing:.06em;opacity:0;animation:abAparece 1.2s 2.5s forwards}
.ab-toque{margin:7vh 0 0;color:var(--gold);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:.9rem;opacity:0;animation:abAparece .8s 3.3s forwards,abPisca 1.8s 4.1s ease-in-out infinite}
@keyframes abPisca{0%,100%{opacity:1}50%{opacity:.35}}
.abertura.sai{animation:abSai .65s ease-in forwards}
.abertura.sai .ab-luz{animation:abClarao .65s ease-in forwards}
@keyframes abClarao{to{opacity:1;transform:scale(9)}}
